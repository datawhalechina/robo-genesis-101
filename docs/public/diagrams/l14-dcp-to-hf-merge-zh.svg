<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">由 identity gates 约束的 LoRA DCP 到 Hugging Face checkpoint 转换</title>
  <desc id="desc">四个训练 rank 写出 distributed-checkpoint shards 和 resolved training state。执行 LoRA merge 前，identity gates 检查 global-step directory、saved training configuration、准确的 base model、action-expert scope、q-k-v-o target modules、rank 8、alpha 16 与全新的 output path。merge 重建 adapter state，并将其应用到准确的 base。输出必须包含 model configuration、processor assets、safetensor weight index、所有被引用的 shard，并能健康启动 server。全参数 SFT 使用另一条 gather-and-convert 路径，没有 adapter 可供 merge。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .heading { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tag { font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.6px; }
      .code { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #475569; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#f8fafc"/>
  <text x="800" y="45" text-anchor="middle" class="title">DCP directory 只有通过 identity-gated conversion 才能部署</text>
  <text x="800" y="77" text-anchor="middle" class="subtitle">Training state、adapter identity、base identity、Hugging Face artifacts 与 server health 是相互独立的门禁。</text>

  <rect x="40" y="112" width="390" height="640" rx="24" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <rect x="64" y="132" width="225" height="34" rx="17" fill="#f3e8ff"/>
  <text x="176" y="155" text-anchor="middle" class="lane" fill="#7e22ce">1 · 训练 ARTIFACT</text>
  <text x="235" y="205" text-anchor="middle" class="heading">FSDP2 distributed checkpoint</text>
  <text x="235" y="235" text-anchor="middle" class="code">checkpoints/global_step_100</text>

  <rect x="75" y="270" width="150" height="100" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.7"/>
  <text x="150" y="300" text-anchor="middle" class="heading">rank 0</text>
  <text x="150" y="327" text-anchor="middle" class="code">model shard</text>
  <text x="150" y="350" text-anchor="middle" class="small">optimizer shard</text>
  <rect x="245" y="270" width="150" height="100" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.7"/>
  <text x="320" y="300" text-anchor="middle" class="heading">rank 1</text>
  <text x="320" y="327" text-anchor="middle" class="code">model shard</text>
  <text x="320" y="350" text-anchor="middle" class="small">optimizer shard</text>
  <rect x="75" y="390" width="150" height="100" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.7"/>
  <text x="150" y="420" text-anchor="middle" class="heading">rank 2</text>
  <text x="150" y="447" text-anchor="middle" class="code">model shard</text>
  <text x="150" y="470" text-anchor="middle" class="small">optimizer shard</text>
  <rect x="245" y="390" width="150" height="100" rx="16" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.7"/>
  <text x="320" y="420" text-anchor="middle" class="heading">rank 3</text>
  <text x="320" y="447" text-anchor="middle" class="code">model shard</text>
  <text x="320" y="470" text-anchor="middle" class="small">optimizer shard</text>

  <rect x="75" y="525" width="320" height="150" rx="18" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.7"/>
  <text x="235" y="556" text-anchor="middle" class="heading">Resolved training identity</text>
  <text x="235" y="586" text-anchor="middle" class="body">saved config · scheduler · RNG</text>
  <text x="235" y="610" text-anchor="middle" class="body">dataloader state · step number</text>
  <text x="235" y="644" text-anchor="middle" class="small">用于 resume 与 audit</text>
  <text x="235" y="666" text-anchor="middle" class="small">server 不能直接加载</text>

  <path d="M430 430 H485" class="flow"/>

  <rect x="485" y="112" width="520" height="640" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <rect x="509" y="132" width="215" height="34" rx="17" fill="#ffedd5"/>
  <text x="616" y="155" text-anchor="middle" class="lane" fill="#c2410c">2 · IDENTITY 门禁</text>

  <rect x="520" y="195" width="450" height="305" rx="20" fill="#ffffff" stroke="#fdba74" stroke-width="1.8"/>
  <rect x="545" y="218" width="180" height="42" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="635" y="244" text-anchor="middle" class="code">global_step_100</text>
  <rect x="745" y="218" width="200" height="42" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="845" y="244" text-anchor="middle" class="code">fresh HF output</text>
  <rect x="545" y="280" width="400" height="55" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="745" y="302" text-anchor="middle" class="body">必须是初始化时使用的准确 base</text>
  <text x="745" y="323" text-anchor="middle" class="code">robbyant/lingbot-vla-v2-6b @ pinned revision</text>
  <rect x="545" y="355" width="190" height="55" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="640" y="378" text-anchor="middle" class="body">scope + targets</text>
  <text x="640" y="399" text-anchor="middle" class="code">action expert · q/k/v/o</text>
  <rect x="755" y="355" width="190" height="55" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="850" y="378" text-anchor="middle" class="body">LoRA dimensions</text>
  <text x="850" y="399" text-anchor="middle" class="code">rank 8 · alpha 16</text>
  <rect x="545" y="430" width="400" height="45" rx="13" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="745" y="458" text-anchor="middle" class="body">不匹配或路径冲突 → 停止；不要猜测或覆盖</text>

  <path d="M745 500 V545" class="flow"/>
  <rect x="555" y="545" width="380" height="135" rx="20" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="745" y="579" text-anchor="middle" class="heading">固定的 LoRA merge entry point</text>
  <text x="745" y="610" text-anchor="middle" class="code">merge_lora_dcp.py</text>
  <text x="745" y="638" text-anchor="middle" class="body">重建 adapter state → 应用到准确的 base</text>
  <text x="745" y="661" text-anchor="middle" class="small">写入新的 Hugging Face checkpoint directory</text>

  <path d="M1005 430 H1060" class="flow"/>

  <rect x="1060" y="112" width="500" height="640" rx="24" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <rect x="1084" y="132" width="255" height="34" rx="17" fill="#d1fae5"/>
  <text x="1211" y="155" text-anchor="middle" class="lane" fill="#047857">3 · 可部署 ARTIFACT</text>
  <text x="1310" y="205" text-anchor="middle" class="heading">全新的 Hugging Face checkpoint</text>
  <text x="1310" y="235" text-anchor="middle" class="code">merged_checkpoint/.../hf_ckpt</text>

  <rect x="1100" y="270" width="200" height="80" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.7"/>
  <text x="1200" y="299" text-anchor="middle" class="heading">Model config</text>
  <text x="1200" y="326" text-anchor="middle" class="code">config.json</text>
  <rect x="1320" y="270" width="200" height="80" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.7"/>
  <text x="1420" y="299" text-anchor="middle" class="heading">Processor assets</text>
  <text x="1420" y="326" text-anchor="middle" class="body">tokenizer · image processor</text>
  <rect x="1100" y="370" width="420" height="95" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.7"/>
  <text x="1310" y="401" text-anchor="middle" class="heading">Safetensor index 与全部引用 shard</text>
  <text x="1310" y="431" text-anchor="middle" class="code">model.safetensors.index.json → *.safetensors</text>
  <rect x="1100" y="490" width="420" height="120" rx="18" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="1310" y="524" text-anchor="middle" class="heading">Serving 门禁</text>
  <text x="1310" y="554" text-anchor="middle" class="body">使用相同 backend flags 与 port 启动</text>
  <text x="1310" y="582" text-anchor="middle" class="code">GET /healthz → healthy</text>
  <rect x="1100" y="635" width="420" height="72" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.7"/>
  <text x="1310" y="664" text-anchor="middle" class="body">Health 证明模型可加载且服务就绪</text>
  <text x="1310" y="688" text-anchor="middle" class="small">task evidence 仍须由闭环回合给出</text>

  <rect x="245" y="785" width="1110" height="55" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.8"/>
  <text x="800" y="808" text-anchor="middle" class="heading">全参数 SFT 路径不同</text>
  <text x="800" y="830" text-anchor="middle" class="body">它的 full-model DCP 由 <tspan class="code">convert_full_sft_dcp.py</tspan> gather 并转换；不存在可 merge 到 base 的 LoRA adapter。</text>
  <text x="800" y="878" text-anchor="middle" class="small">RoboGenesis 101 L14 课程原创示意图。</text>
</svg>
