<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Choose an evaluation-condition label relative to training provenance</title>
  <desc id="desc">A decision flow distinguishes four labels. A predeclared report baseline is Reference. For another condition, missing provenance or overlapping support is Shifted. With auditable support, new values inside the documented training range are Unseen in-support, while values demonstrably outside a disjoint range are OOD when other important factors remain controlled. Miniature range diagrams reinforce each distinction.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .question { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .questionBody { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .label { font: 700 21px Inter, ui-sans-serif, system-ui, sans-serif; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .branch { font: 700 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #94a3b8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" class="title">Which label describes this evaluation condition?</text>
  <text x="800" y="78" text-anchor="middle" class="subtitle">Choose relative to documented training support—not from a “DR on” switch.</text>

  <rect x="55" y="130" width="280" height="96" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="195" y="164" text-anchor="middle" class="question">Condition to name</text>
  <text x="195" y="191" text-anchor="middle" class="questionBody">Declare it before viewing</text>
  <text x="195" y="211" text-anchor="middle" class="questionBody">episode outcomes.</text>

  <path d="M335 178 H410" class="flow"/>

  <rect x="410" y="118" width="410" height="120" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="615" y="154" text-anchor="middle" class="question">Is this the predeclared baseline</text>
  <text x="615" y="179" text-anchor="middle" class="question">for this report?</text>
  <text x="615" y="210" text-anchor="middle" class="questionBody">This asks about its role in the comparison.</text>

  <path d="M820 178 H1000" class="flow"/>
  <rect x="868" y="155" width="50" height="25" rx="12" fill="#dcfce7"/>
  <text x="893" y="172" text-anchor="middle" class="branch">YES</text>

  <path d="M615 238 V305" class="flow"/>
  <rect x="631" y="254" width="44" height="25" rx="12" fill="#f1f5f9"/>
  <text x="653" y="271" text-anchor="middle" class="branch">NO</text>

  <rect x="410" y="305" width="410" height="132" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="615" y="342" text-anchor="middle" class="question">Is the support relation auditable</text>
  <text x="615" y="367" text-anchor="middle" class="question">and unambiguous?</text>
  <text x="615" y="398" text-anchor="middle" class="questionBody">Missing provenance or partial overlap</text>
  <text x="615" y="418" text-anchor="middle" class="questionBody">prevents a clean inside/outside claim.</text>

  <path d="M820 371 H1000" class="flow"/>
  <rect x="842" y="337" width="132" height="25" rx="12" fill="#ffedd5"/>
  <text x="908" y="354" text-anchor="middle" class="branch">NO / OVERLAP</text>

  <path d="M615 437 V510" class="flow"/>
  <rect x="631" y="456" width="50" height="25" rx="12" fill="#dcfce7"/>
  <text x="656" y="473" text-anchor="middle" class="branch">YES</text>

  <rect x="410" y="510" width="410" height="145" rx="20" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2"/>
  <text x="615" y="548" text-anchor="middle" class="question">Where are the evaluation values</text>
  <text x="615" y="573" text-anchor="middle" class="question">relative to known training support?</text>
  <rect x="450" y="600" width="145" height="33" rx="16" fill="#ccfbf1"/>
  <text x="522" y="622" text-anchor="middle" class="branch">FULLY INSIDE</text>
  <rect x="630" y="600" width="150" height="33" rx="16" fill="#fee2e2"/>
  <text x="705" y="622" text-anchor="middle" class="branch">DISJOINT</text>

  <path d="M820 558 H1000" class="flow"/>
  <rect x="854" y="524" width="112" height="25" rx="12" fill="#ccfbf1"/>
  <text x="910" y="541" text-anchor="middle" class="branch">FULLY INSIDE</text>

  <path d="M820 620 H900 V744 H1000" class="flow"/>
  <rect x="838" y="636" width="84" height="25" rx="12" fill="#fee2e2"/>
  <text x="880" y="653" text-anchor="middle" class="branch">DISJOINT</text>

  <rect x="1000" y="100" width="545" height="156" rx="20" fill="#f0fdf4" stroke="#4ade80" stroke-width="2.2"/>
  <text x="1030" y="133" class="label" fill="#15803d">REFERENCE</text>
  <text x="1030" y="158" class="body">The report's baseline, fixed before outcomes are known.</text>
  <text x="1030" y="180" class="small">“Reference” names a comparison role; audit its alignment separately.</text>
  <line x1="1050" y1="220" x2="1500" y2="220" class="axis"/>
  <rect x="1150" y="205" width="235" height="30" rx="15" fill="#bfdbfe" opacity="0.9"/>
  <text x="1267" y="225" text-anchor="middle" class="small">documented training support</text>
  <circle cx="1295" cy="220" r="10" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
  <text x="1435" y="225" class="small">baseline</text>

  <rect x="1000" y="282" width="545" height="178" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2.2"/>
  <text x="1030" y="316" class="label" fill="#c2410c">SHIFTED</text>
  <text x="1030" y="341" class="body">A factor changed, but provenance cannot prove disjoint support.</text>
  <text x="1030" y="363" class="small">Use this for missing support records or partially overlapping ranges.</text>
  <line x1="1050" y1="420" x2="1500" y2="420" class="axis"/>
  <rect x="1110" y="394" width="215" height="18" rx="9" fill="#bfdbfe"/>
  <text x="1217" y="390" text-anchor="middle" class="small">training</text>
  <rect x="1270" y="426" width="190" height="18" rx="9" fill="#fdba74"/>
  <text x="1365" y="453" text-anchor="middle" class="small">evaluation overlaps—or support is unknown</text>

  <rect x="1000" y="482" width="545" height="160" rx="20" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="2.2"/>
  <text x="1030" y="516" class="label" fill="#0f766e">UNSEEN IN-SUPPORT</text>
  <text x="1030" y="541" class="body">New seeds or domains stay inside documented training support.</text>
  <text x="1030" y="563" class="small">The instances are new; the audited parameter range is not.</text>
  <line x1="1050" y1="607" x2="1500" y2="607" class="axis"/>
  <rect x="1120" y="592" width="300" height="30" rx="15" fill="#bfdbfe" opacity="0.9"/>
  <circle cx="1175" cy="607" r="9" fill="#0d9488" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1270" cy="607" r="9" fill="#0d9488" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1375" cy="607" r="9" fill="#0d9488" stroke="#ffffff" stroke-width="3"/>
  <text x="1270" y="636" text-anchor="middle" class="small">new draws remain inside training support</text>

  <rect x="1000" y="665" width="545" height="160" rx="20" fill="#fef2f2" stroke="#f87171" stroke-width="2.2"/>
  <text x="1030" y="699" class="label" fill="#b91c1c">OOD</text>
  <text x="1030" y="724" class="body">The named factor is demonstrably outside documented support.</text>
  <text x="1030" y="746" class="small">The ranges are disjoint and other important factors stay controlled.</text>
  <line x1="1050" y1="790" x2="1500" y2="790" class="axis"/>
  <rect x="1090" y="775" width="180" height="30" rx="15" fill="#bfdbfe"/>
  <rect x="1375" y="775" width="100" height="30" rx="15" fill="#fca5a5"/>
  <text x="1180" y="795" text-anchor="middle" class="small">training</text>
  <text x="1425" y="795" text-anchor="middle" class="small">evaluation</text>
  <path d="M1288 790 H1357" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="55" y="700" width="765" height="125" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="80" y="736" class="question">Keep the factor name attached to the claim</text>
  <text x="80" y="765" class="body">banana → lemon is an object/task shift, not “friction OOD.”</text>
  <text x="80" y="791" class="body">An in-support domain parameter also does not guarantee that every state</text>
  <text x="80" y="813" class="body">visited by a closed-loop policy appeared in the demonstrations.</text>

  <rect x="55" y="850" width="1490" height="32" rx="16" fill="#e2e8f0"/>
  <text x="800" y="871" text-anchor="middle" class="small">Blue bands show documented training support; colored marks show the evaluation condition. Course-created schematic for RoboGenesis 101 L13.</text>
</svg>
