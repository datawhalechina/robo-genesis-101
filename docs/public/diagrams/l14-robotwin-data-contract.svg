<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RoboTwin data conversion and LingBot training contract</title>
  <desc id="desc">Fifty RoboTwin demo-clean task directories are converted independently into fifty LeRobot version-three joint datasets. A fifty-entry text manifest selects those datasets for LingBot training. The audit then checks actual metadata shapes and dtypes, maps three logical training-camera names to evaluator observation keys and RoboTwin cameras, separates semantic arm, end, and effector joint groups from converter padding and model maximum dimensions, and verifies that normalization statistics cover every required group. No shape is inferred from a filename or maximum model capacity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .heading { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tag { font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.6px; }
      .code { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#f8fafc"/>
  <text x="800" y="45" text-anchor="middle" class="title">The training contract is a chain of datasets, metadata, mappings, and statistics</text>
  <text x="800" y="77" text-anchor="middle" class="subtitle">A manifest selects fifty independently converted tasks; actual metadata and configuration—not names or maxima—define tensor meaning.</text>

  <rect x="40" y="112" width="1520" height="310" rx="24" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <rect x="64" y="132" width="270" height="34" rx="17" fill="#cffafe"/>
  <text x="199" y="155" text-anchor="middle" class="lane" fill="#0e7490">CONVERSION AND SELECTION</text>

  <rect x="70" y="200" width="280" height="150" rx="18" fill="#ffffff" stroke="#67e8f9" stroke-width="1.8"/>
  <text x="210" y="233" text-anchor="middle" class="heading">RoboTwin source</text>
  <text x="210" y="264" text-anchor="middle" class="code">data/demo_clean/&lt;task&gt;</text>
  <text x="210" y="292" text-anchor="middle" class="body">50 task directories</text>
  <text x="210" y="317" text-anchor="middle" class="small">up to 50 source episodes per task</text>

  <path d="M350 275 H430" class="flow"/>
  <rect x="430" y="185" width="330" height="180" rx="18" fill="#ffffff" stroke="#67e8f9" stroke-width="1.8"/>
  <text x="595" y="218" text-anchor="middle" class="heading">XPolicyLab conversion</text>
  <text x="595" y="248" text-anchor="middle" class="code">transform_lerobot_v30_format.py</text>
  <text x="595" y="281" text-anchor="middle" class="body">one task at a time · joint layout + padding</text>
  <text x="595" y="305" text-anchor="middle" class="body">H.264 media · LeRobot-compatible reader</text>
  <rect x="493" y="326" width="204" height="25" rx="12" fill="#cffafe"/>
  <text x="595" y="343" text-anchor="middle" class="tag" fill="#0e7490">50 INDEPENDENT OUTPUTS</text>

  <path d="M760 275 H840" class="flow"/>
  <rect x="840" y="200" width="300" height="150" rx="18" fill="#ffffff" stroke="#67e8f9" stroke-width="1.8"/>
  <text x="990" y="233" text-anchor="middle" class="heading">LeRobot v3 datasets</text>
  <text x="990" y="264" text-anchor="middle" class="code">data/lerobot/</text>
  <text x="990" y="287" text-anchor="middle" class="code">&lt;task&gt;_joint_v30</text>
  <text x="990" y="319" text-anchor="middle" class="small">each owns metadata, episodes, and media</text>

  <path d="M1140 275 H1220" class="flow"/>
  <rect x="1220" y="185" width="310" height="180" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="1375" y="218" text-anchor="middle" class="heading">LingBot training manifest</text>
  <text x="1375" y="250" text-anchor="middle" class="code">robotwin_demo_clean_</text>
  <text x="1375" y="272" text-anchor="middle" class="code">joint_v30.txt</text>
  <text x="1375" y="306" text-anchor="middle" class="body">50 entries select 50 datasets</text>
  <text x="1375" y="333" text-anchor="middle" class="small">not one monolithic dataset directory</text>

  <rect x="40" y="455" width="1520" height="365" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="64" y="475" width="240" height="34" rx="17" fill="#e2e8f0"/>
  <text x="184" y="498" text-anchor="middle" class="lane" fill="#334155">FOUR-LAYER AUDIT</text>

  <rect x="65" y="540" width="340" height="220" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
  <rect x="85" y="558" width="106" height="26" rx="13" fill="#dbeafe"/>
  <text x="138" y="576" text-anchor="middle" class="tag" fill="#1d4ed8">1 · METADATA</text>
  <text x="235" y="614" text-anchor="middle" class="heading">Inspect what is stored</text>
  <text x="235" y="647" text-anchor="middle" class="code">meta/info.json</text>
  <text x="235" y="677" text-anchor="middle" class="body">image · state · action shapes</text>
  <text x="235" y="701" text-anchor="middle" class="body">dtype · FPS · episodes · tasks</text>
  <text x="235" y="735" text-anchor="middle" class="small">report actual values; do not infer them</text>

  <rect x="435" y="540" width="340" height="220" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
  <rect x="455" y="558" width="106" height="26" rx="13" fill="#d1fae5"/>
  <text x="508" y="576" text-anchor="middle" class="tag" fill="#047857">2 · CAMERAS</text>
  <text x="605" y="614" text-anchor="middle" class="heading">Map three naming layers</text>
  <text x="605" y="646" text-anchor="middle" class="code">camera_top → cam_high → head_camera</text>
  <text x="605" y="674" text-anchor="middle" class="code">camera_wrist_left → cam_left_wrist</text>
  <text x="605" y="697" text-anchor="middle" class="code">camera_wrist_right → cam_right_wrist</text>
  <text x="605" y="731" text-anchor="middle" class="small">training YAML · request key · simulator camera</text>

  <rect x="805" y="540" width="340" height="220" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <rect x="825" y="558" width="106" height="26" rx="13" fill="#ffedd5"/>
  <text x="878" y="576" text-anchor="middle" class="tag" fill="#c2410c">3 · JOINTS</text>
  <text x="975" y="614" text-anchor="middle" class="heading">Separate semantics from capacity</text>
  <text x="975" y="646" text-anchor="middle" class="code">arm=14 · end=14 · effector=2</text>
  <text x="975" y="674" text-anchor="middle" class="body">converter layout + padding target</text>
  <text x="975" y="699" text-anchor="middle" class="code">max_state/action_dim = 55</text>
  <text x="975" y="731" text-anchor="middle" class="small">55 is capacity—not a stored-shape guess</text>

  <rect x="1175" y="540" width="360" height="220" rx="18" fill="#faf5ff" stroke="#c084fc" stroke-width="1.8"/>
  <rect x="1195" y="558" width="126" height="26" rx="13" fill="#f3e8ff"/>
  <text x="1258" y="576" text-anchor="middle" class="tag" fill="#7e22ce">4 · NORM STATS</text>
  <text x="1355" y="614" text-anchor="middle" class="heading">Prove group coverage</text>
  <text x="1355" y="647" text-anchor="middle" class="code">robotwin.json</text>
  <text x="1355" y="677" text-anchor="middle" class="body">required state/action groups exist</text>
  <text x="1355" y="701" text-anchor="middle" class="body">dimensions agree with semantic config</text>
  <text x="1355" y="735" text-anchor="middle" class="small">missing statistics fail the preflight</text>

  <path d="M405 650 H435" class="flow"/>
  <path d="M775 650 H805" class="flow"/>
  <path d="M1145 650 H1175" class="flow"/>

  <text x="800" y="858" text-anchor="middle" class="body">Training may start only when the manifest, stored features, camera adapter, semantic groups, padding, model capacities, and normalization keys agree.</text>
  <text x="800" y="884" text-anchor="middle" class="small">Course-created schematic for RoboGenesis 101 L14.</text>
</svg>
