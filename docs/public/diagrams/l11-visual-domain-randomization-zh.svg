  <line x1="1236" y1="255" x2="1208" y2="302" stroke="#f59e0b" stroke-width="3" opacity="0.65"/>
  <line x1="1110" y1="352" x2="1270" y2="352" class="table"/>
  <ellipse cx="1172" cy="359" rx="42" ry="10" fill="#64748b" opacity="0.35"/>
  <path d="M1136 343 C1147 325 1169 326 1184 341 C1170 352 1148 353 1136 343 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <path d="M1215 334 Q1232 350 1249 334 L1243 359 H1221 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="1122" cy="310" r="14" fill="#f472b6" stroke="#be185d"/>
  <rect x="1250" y="291" width="22" height="22" rx="3" fill="#34d399" stroke="#047857"/>
  <text x="1190" y="451" text-anchor="middle" class="heading">lighting · background</text>
  <text x="1190" y="477" text-anchor="middle" class="body">shadow · clutter · distractor</text>
  <text x="1190" y="511" text-anchor="middle" class="small">task object 含义保持不变</text>
  <rect x="1100" y="548" width="180" height="34" rx="17" fill="#e2e8f0"/>
  <text x="1190" y="570" text-anchor="middle" class="small">L11 未实践</text>
  <rect x="1100" y="596" width="180" height="44" rx="13" fill="#e2e8f0"/>
  <text x="1190" y="614" text-anchor="middle" class="small">只作概念介绍</text>
  <text x="1190" y="631" text-anchor="middle" class="small">lighting · background</text>

  <rect x="1320" y="108" width="245" height="576" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1442" y="145" text-anchor="middle" class="section">4 · Sensor pipeline</text>
  <text x="1442" y="171" text-anchor="middle" class="small">scene rendering 后的 corruption</text>
  <rect x="1340" y="198" width="205" height="220" rx="13" fill="#f1f5f9" stroke="#94a3b8"/>
  <g filter="url(#softBlur)" opacity="0.78">
    <line x1="1355" y1="352" x2="1530" y2="352" class="table"/>
    <path d="M1381 343 C1392 325 1414 326 1429 341 C1415 352 1393 353 1381 343 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <path d="M1470 334 Q1487 350 1504 334 L1498 359 H1476 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <circle cx="1370" cy="226" r="3" fill="#475569"/>
  <circle cx="1415" cy="246" r="2" fill="#94a3b8"/>
  <circle cx="1468" cy="219" r="3" fill="#64748b"/>
  <circle cx="1517" cy="262" r="2" fill="#334155"/>
  <circle cx="1393" cy="298" r="2" fill="#334155"/>
  <circle cx="1444" cy="283" r="3" fill="#94a3b8"/>
  <circle cx="1525" cy="319" r="3" fill="#64748b"/>
  <rect x="1352" y="369" width="35" height="26" fill="#cbd5e1" opacity="0.9"/>
  <rect x="1433" y="207" width="42" height="31" fill="#ffffff" opacity="0.85"/>
  <line x1="1348" y1="278" x2="1537" y2="278" stroke="#64748b" stroke-width="2" opacity="0.5"/>
  <text x="1442" y="451" text-anchor="middle" class="heading">noise · blur · dropout</text>
  <text x="1442" y="477" text-anchor="middle" class="body">exposure · quantization · latency</text>
  <text x="1442" y="511" text-anchor="middle" class="small">定义 temporal noise process</text>
  <rect x="1352" y="548" width="180" height="34" rx="17" fill="#e2e8f0"/>
  <text x="1442" y="570" text-anchor="middle" class="small">L11 未实践</text>
  <rect x="1352" y="596" width="180" height="44" rx="13" fill="#e2e8f0"/>
  <text x="1442" y="614" text-anchor="middle" class="small">只作概念介绍</text>
  <text x="1442" y="631" text-anchor="middle" class="small">sensor corruption</text>

  <rect x="35" y="714" width="20" height="20" rx="5" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="67" y="729" class="small">青色 = 当前 L11 实践已实现</text>
  <rect x="367" y="714" width="20" height="20" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="399" y="729" class="small">灰色 = 领域概念，本实验未实现</text>
  <text x="800" y="767" text-anchor="middle" class="small">课程原创示意图，参数类别参考 Tobin et al.（2017）的视觉随机化工作；并非对论文图片的复制。</text>
  <text x="800" y="793" text-anchor="middle" class="small">像素变化只能证明 observation knob 已运行，不能证明采样分布真实、充分或有效。</text>
</svg>
