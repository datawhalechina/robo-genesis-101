<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">同一个机器人任务中的四类视觉 domain variation</title>
  <desc id="desc">固定香蕉放入碗中的操作任务，同时采样 visual domain parameter。四幅自制示意场景分别展示 appearance 变化，例如颜色、纹理和材质；camera 变化，例如位姿和视场角；scene 与 lighting 变化，例如照明、背景、clutter 和 distractor；以及 sensor 或 image pipeline 变化，例如噪声、模糊、dropout 和曝光。青色标签表示第 11 讲当前实现了桌面与物体纯色、视场角和静态 world-camera pose。纹理、材质、灯光、背景、clutter 与 sensor corruption 仅作概念介绍。本图依据 Tobin 等人在 2017 年描述的参数类别由课程原创绘制，不是对论文图片的复制。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="taskArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .taskFlow { stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 4; fill: none; marker-end: url(#taskArrow); }
      .arm { stroke: #64748b; stroke-width: 11; stroke-linecap: round; fill: none; }
      .joint { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
      .table { stroke: #475569; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="820" rx="24" fill="#f8fafc"/>
  <text x="800" y="44" text-anchor="middle" class="title">视觉域随机化保持任务不变，改变 observation</text>
  <text x="800" y="74" text-anchor="middle" class="subtitle">同一个香蕉入碗任务 · 多个采样 visual domain · 明确的实现边界</text>

  <rect x="35" y="108" width="290" height="576" rx="20" fill="#ffffff" stroke="#facc15" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" class="section">固定的任务语义</text>
  <text x="180" y="174" text-anchor="middle" class="body">抓起香蕉 → 放入碗中</text>

  <rect x="60" y="204" width="240" height="270" rx="15" fill="#fefce8" stroke="#fde047"/>
  <line x1="78" y1="408" x2="282" y2="408" class="table"/>
  <line x1="96" y1="408" x2="88" y2="452" stroke="#64748b" stroke-width="5"/>
  <line x1="264" y1="408" x2="272" y2="452" stroke="#64748b" stroke-width="5"/>
  <rect x="76" y="356" width="28" height="52" rx="5" fill="#94a3b8"/>
  <path d="M90 355 L118 318 L154 300" class="arm"/>
  <circle cx="118" cy="318" r="10" class="joint"/>
  <circle cx="154" cy="300" r="10" class="joint"/>
  <path d="M154 300 L183 332" class="arm"/>
  <line x1="178" y1="327" x2="190" y2="338" stroke="#475569" stroke-width="4"/>
  <line x1="184" y1="322" x2="196" y2="333" stroke="#475569" stroke-width="4"/>
  <path d="M132 383 C143 365 167 366 181 381 C167 391 145 394 132 383 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <path d="M223 375 Q244 394 265 375 L257 405 H231 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <path d="M180 366 C197 340 220 344 234 361" class="taskFlow"/>
  <text x="180" y="445" text-anchor="middle" class="small">相同 object · goal · success predicate</text>

  <rect x="60" y="500" width="240" height="70" rx="13" fill="#ecfdf5" stroke="#34d399"/>
  <text x="180" y="528" text-anchor="middle" class="heading">不变量</text>
  <text x="180" y="552" text-anchor="middle" class="body">怎样才算任务成功</text>
  <rect x="60" y="590" width="240" height="62" rx="13" fill="#fff7ed" stroke="#fb923c"/>
  <text x="180" y="616" text-anchor="middle" class="heading">检查每一次 draw</text>
  <text x="180" y="639" text-anchor="middle" class="small">身份 · 可见性 · 可行性</text>

  <path d="M325 396 H360" class="flow"/>
  <rect x="375" y="288" width="175" height="216" rx="87" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="462" y="350" text-anchor="middle" class="heading">采样一个</text>
  <text x="462" y="376" text-anchor="middle" class="heading">visual domain</text>
  <text x="462" y="416" text-anchor="middle" class="code">xi_visual</text>
  <text x="462" y="442" text-anchor="middle" class="code">~ p_phi</text>
  <text x="462" y="474" text-anchor="middle" class="small">记录这次 draw</text>

  <path d="M550 396 H573" class="flow"/>
  <path d="M561 396 V104 H1440 V118" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5" fill="none"/>

  <rect x="585" y="108" width="230" height="576" rx="20" fill="#ffffff" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="700" y="145" text-anchor="middle" class="section">1 · Appearance</text>
  <text x="700" y="171" text-anchor="middle" class="small">表面与渲染响应</text>
  <rect x="605" y="198" width="190" height="220" rx="13" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="620" y="342" width="160" height="42" rx="4" fill="#a78bfa"/>
  <line x1="632" y1="384" x2="628" y2="404" stroke="#64748b" stroke-width="4"/>
