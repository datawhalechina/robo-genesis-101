  <path d="M724 329 Q744 347 764 329 L757 359 H731 Z" fill="#67e8f9" stroke="#0891b2" stroke-width="2"/>
  <text x="700" y="451" text-anchor="middle" class="heading">颜色 · texture · material</text>
  <text x="700" y="477" text-anchor="middle" class="body">roughness · reflectance</text>
  <text x="700" y="511" text-anchor="middle" class="small">相同 geometry 与 task</text>
  <rect x="610" y="548" width="180" height="34" rx="17" fill="#ccfbf1"/>
  <text x="700" y="570" text-anchor="middle" class="tiny">L11：FLAT COLOR</text>
  <rect x="610" y="596" width="180" height="44" rx="13" fill="#e2e8f0"/>
  <text x="700" y="614" text-anchor="middle" class="small">只作概念介绍</text>
  <text x="700" y="631" text-anchor="middle" class="small">texture · material</text>

  <rect x="830" y="108" width="230" height="576" rx="20" fill="#ffffff" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="945" y="145" text-anchor="middle" class="section">2 · Camera</text>
  <text x="945" y="171" text-anchor="middle" class="small">视点与图像几何</text>
  <rect x="850" y="198" width="190" height="220" rx="13" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="858" y="292" width="36" height="26" rx="5" fill="#60a5fa" stroke="#2563eb" stroke-width="2"/>
  <path d="M894 296 L908 290 L908 320 L894 314 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
  <line x1="908" y1="290" x2="920" y2="216" stroke="#60a5fa" stroke-width="2"/>
