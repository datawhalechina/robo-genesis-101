  <line x1="930" y1="352" x2="1016" y2="352" class="table"/>
  <path d="M936 343 C947 325 969 326 984 341 C970 352 948 353 936 343 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  <path d="M979 334 Q996 350 1013 334 L1007 359 H985 Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="920" y="216" width="98" height="178" rx="8" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="945" y="451" text-anchor="middle" class="heading">pose · FOV · intrinsics</text>
  <text x="945" y="477" text-anchor="middle" class="body">构图 · calibration</text>
  <text x="945" y="511" text-anchor="middle" class="small">工作区必须保持可见</text>
  <rect x="855" y="548" width="180" height="34" rx="17" fill="#ccfbf1"/>
  <text x="945" y="570" text-anchor="middle" class="tiny">L11：FOV + WORLD POSE</text>
  <rect x="855" y="596" width="180" height="44" rx="13" fill="#e2e8f0"/>
  <text x="945" y="614" text-anchor="middle" class="small">只作概念介绍</text>
  <text x="945" y="631" text-anchor="middle" class="small">distortion · exposure</text>

  <rect x="1075" y="108" width="230" height="576" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1190" y="145" text-anchor="middle" class="section">3 · Scene 与 lighting</text>
  <text x="1190" y="171" text-anchor="middle" class="small">任务周围的 context</text>
  <rect x="1095" y="198" width="190" height="220" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/>
  <circle cx="1250" cy="230" r="23" fill="#fde047" stroke="#f59e0b" stroke-width="2"/>
