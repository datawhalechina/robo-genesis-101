<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Offline probes and closed-loop policy evaluation</title>
  <desc id="desc">The upper lane shows a recorded observation entering a one-sample policy probe or recorded actions entering playback. These checks can verify compatibility but do not return the consequences of the action to the policy. The lower lane shows the closed loop: live world and wrist images plus robot state enter preprocessing, the policy, and its action queue; a finite nine-dimensional joint target is held by the controller while Genesis advances; the next state is rendered as the next live observation. A third-person camera records evidence but never enters policy input.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <marker id="feedbackArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <marker id="evidenceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 31px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; }
      .heading { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #0f766e; stroke-width: 3; fill: none; marker-end: url(#feedbackArrow); }
      .evidence { stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#evidenceArrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="24" fill="#f8fafc"/>
  <text x="800" y="45" text-anchor="middle" class="title">Closed-loop evaluation returns action consequences to the policy</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">A finite offline prediction can verify an interface; only live feedback exposes compounding error and recovery.</text>

  <rect x="45" y="110" width="1510" height="230" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="72" y="145" class="lane" fill="#c2410c">OFFLINE OR OPEN LOOP · useful evidence, but no policy feedback</text>

  <rect x="85" y="182" width="245" height="105" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.7"/>
  <text x="207" y="214" text-anchor="middle" class="heading">Recorded sample</text>
  <text x="207" y="242" text-anchor="middle" class="body">stored images + state</text>
  <text x="207" y="267" text-anchor="middle" class="small">or stored action sequence</text>

  <path d="M330 234.5 H390" class="flow"/>
  <rect x="390" y="182" width="270" height="105" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.7"/>
  <text x="525" y="214" text-anchor="middle" class="heading">Probe or playback</text>
  <text x="525" y="242" text-anchor="middle" class="body">one policy prediction</text>
  <text x="525" y="267" text-anchor="middle" class="small">or replay recorded targets</text>

  <path d="M660 234.5 H720" class="flow"/>
  <rect x="720" y="182" width="250" height="105" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="1.7"/>
  <text x="845" y="214" text-anchor="middle" class="heading">Interface evidence</text>
  <text x="845" y="242" text-anchor="middle" class="code">shape · dtype · finite</text>
  <text x="845" y="267" text-anchor="middle" class="small">data and checkpoint connect</text>

  <path d="M970 234.5 H1030" class="flow"/>
  <rect x="1030" y="172" width="455" height="125" rx="16" fill="#fee2e2" stroke="#f87171" stroke-width="1.8"/>
  <text x="1257" y="207" text-anchor="middle" class="heading">Missing causal edge</text>
  <text x="1257" y="237" text-anchor="middle" class="body">the action's consequence never becomes</text>
  <text x="1257" y="262" text-anchor="middle" class="body">the next observation used for a new decision</text>
  <text x="1257" y="283" text-anchor="middle" class="small">recovery and compounding error remain untested</text>

  <rect x="45" y="375" width="1510" height="405" rx="22" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="72" y="412" class="lane" fill="#0e7490">CLOSED LOOP · live observation → action → transition → next live observation</text>

  <rect x="70" y="472" width="230" height="120" rx="16" fill="#ffffff" stroke="#67e8f9" stroke-width="1.8"/>
  <text x="185" y="504" text-anchor="middle" class="heading">Live observation at t</text>
  <text x="185" y="532" text-anchor="middle" class="body">world RGB · wrist RGB</text>
  <text x="185" y="558" text-anchor="middle" class="code">q_t ∈ R⁹</text>
  <text x="185" y="580" text-anchor="middle" class="small">captured from the current sim</text>

  <path d="M300 532 H370" class="flow"/>
  <rect x="370" y="462" width="300" height="140" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.9"/>
  <text x="520" y="497" text-anchor="middle" class="heading">Processor + policy</text>
  <text x="520" y="527" text-anchor="middle" class="body">normalize · resize · rename</text>
  <text x="520" y="552" text-anchor="middle" class="body">ACT or SmolVLA inference</text>
  <text x="520" y="578" text-anchor="middle" class="small">action queue resets each episode</text>

  <path d="M670 532 H740" class="flow"/>
  <rect x="740" y="472" width="180" height="120" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="830" y="504" text-anchor="middle" class="heading">Policy action</text>
  <text x="830" y="535" text-anchor="middle" class="code">a_t ∈ R⁹</text>
  <text x="830" y="561" text-anchor="middle" class="body">joint-position target</text>
  <text x="830" y="581" text-anchor="middle" class="small">finite before application</text>

  <path d="M920 532 H990" class="flow"/>
  <rect x="990" y="462" width="260" height="140" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.9"/>
  <text x="1120" y="497" text-anchor="middle" class="heading">Controller + Genesis</text>
  <text x="1120" y="527" text-anchor="middle" class="body">hold target between queries</text>
  <text x="1120" y="552" text-anchor="middle" class="code">scene.step() @ 100 Hz</text>
  <text x="1120" y="578" text-anchor="middle" class="small">contact changes the world</text>

  <path d="M1250 532 H1320" class="flow"/>
  <rect x="1320" y="472" width="210" height="120" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="1.9"/>
  <text x="1425" y="504" text-anchor="middle" class="heading">Next state</text>
  <text x="1425" y="535" text-anchor="middle" class="code">x_t+1</text>
  <text x="1425" y="561" text-anchor="middle" class="body">new pose + contact</text>
  <text x="1425" y="581" text-anchor="middle" class="small">may include policy error</text>

  <path d="M1425 592 V738 H185 V592" class="feedback"/>
  <text x="690" y="762" text-anchor="middle" class="small">render x_t+1 as observation_t+1 and decide again at the dataset FPS</text>

  <rect x="990" y="635" width="400" height="72" rx="15" fill="#faf5ff" stroke="#c084fc" stroke-width="1.7"/>
  <text x="1190" y="662" text-anchor="middle" class="heading">Third-person camera</text>
  <text x="1190" y="688" text-anchor="middle" class="body">rollout evidence only · never a policy feature</text>
  <path d="M1120 602 V635" class="evidence"/>

  <rect x="45" y="812" width="1510" height="55" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="800" y="846" text-anchor="middle" class="body">Closed-loop evidence is scoped to a frozen task, success rule, seed schedule, checkpoint, and evaluation condition.</text>
  <text x="800" y="889" text-anchor="middle" class="small">Course-created schematic for RoboGenesis 101 L13.</text>
</svg>
