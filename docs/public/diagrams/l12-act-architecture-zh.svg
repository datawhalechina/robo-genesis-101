<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ACT 在训练与推理时的模型架构</title>
  <desc id="desc">橙色训练专用路径把当前机器人状态和演示中的未来动作块送入 CVAE Transformer encoder，得到 posterior 的 mean 与 log variance，采样 latent z，并用标准正态先验约束它。推理时，绿色路径会跳过该 encoder，改为提供全零 latent。蓝色共享路径用同一个 ResNet 视觉主干编码两路相机图像，把机器人状态和 latent 投影成 token，经 Transformer encoder 处理，再由 Transformer decoder 为动作块中的每个位置读取一个 learned action query，最后经线性 action head 输出预测动作块。训练目标为 masked L1 重建误差与加权 KL loss；运行时最多消费 n_action_steps 个动作后重新查询策略。本图依据 ACT 论文和课程锁定的 LeRobot 0.6.0 实现由课程原创绘制。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="trainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="inferArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; }
      .heading { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 700 11px Inter, ui-sans-serif, system-ui, sans-serif; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #475569; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .train { stroke: #ea580c; stroke-width: 2.4; fill: none; marker-end: url(#trainArrow); }
      .infer { stroke: #059669; stroke-width: 2.4; stroke-dasharray: 8 6; fill: none; marker-end: url(#inferArrow); }
    </style>
  </defs>

  <rect width="1600" height="980" rx="24" fill="#f8fafc"/>
  <text x="800" y="45" text-anchor="middle" class="title">ACT 将训练专用 posterior 与共享的动作块预测器分开</text>
  <text x="800" y="76" text-anchor="middle" class="subtitle">演示中的未来动作只在训练时可见；两种模式都用图像和当前机器人状态作为主 Transformer 的条件。</text>

  <rect x="40" y="108" width="910" height="230" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="68" y="140" class="lane" fill="#c2410c">仅训练使用 · approximate posterior qφ(z | state, actions)</text>

  <rect x="68" y="164" width="240" height="110" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.6"/>
  <text x="188" y="193" text-anchor="middle" class="heading">演示目标</text>
  <text x="188" y="220" text-anchor="middle" class="code">当前状态 q_t</text>
  <text x="188" y="246" text-anchor="middle" class="code">动作 a_t:t+H-1</text>
  <text x="188" y="265" text-anchor="middle" class="small">以及 padding mask</text>

  <path d="M308 219 H365" class="train"/>
  <rect x="365" y="164" width="220" height="110" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.6"/>
  <text x="475" y="196" text-anchor="middle" class="heading">CVAE encoder</text>
  <text x="475" y="222" text-anchor="middle" class="body">Transformer 处理</text>
  <text x="475" y="245" text-anchor="middle" class="code">[CLS]、state、actions</text>

  <path d="M585 219 H640" class="train"/>
  <rect x="640" y="150" width="280" height="138" rx="16" fill="#ffedd5" stroke="#f97316" stroke-width="1.8"/>
  <text x="780" y="181" text-anchor="middle" class="heading">Posterior 与 latent sample</text>
  <text x="780" y="210" text-anchor="middle" class="code">μ、log σ²</text>
  <text x="780" y="237" text-anchor="middle" class="code">z = μ + σ · ε</text>
  <text x="780" y="263" text-anchor="middle" class="small">ε ~ N(0, I)</text>
  <rect x="375" y="296" width="200" height="26" rx="13" fill="#fed7aa"/>
  <text x="475" y="314" text-anchor="middle" class="tiny" fill="#9a3412">KL(qφ || N(0, I))</text>

  <rect x="1000" y="108" width="560" height="230" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="1028" y="140" class="lane" fill="#047857">仅推理使用 · 没有演示中的未来动作</text>
  <rect x="1040" y="168" width="210" height="104" rx="16" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6"/>
  <text x="1145" y="198" text-anchor="middle" class="heading">跳过 CVAE encoder</text>
  <text x="1145" y="225" text-anchor="middle" class="body">未来动作目标</text>
  <text x="1145" y="247" text-anchor="middle" class="body">此时还不存在</text>
  <path d="M1250 220 H1307" class="infer"/>
  <rect x="1307" y="168" width="215" height="104" rx="16" fill="#d1fae5" stroke="#10b981" stroke-width="1.8"/>
  <text x="1415" y="204" text-anchor="middle" class="heading">确定性 latent</text>
  <text x="1415" y="238" text-anchor="middle" class="code">z = 0</text>

  <rect x="680" y="365" width="200" height="82" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text x="780" y="396" text-anchor="middle" class="heading">Latent 输入</text>
  <text x="780" y="425" text-anchor="middle" class="code">project(z)</text>
  <path d="M780 288 V365" class="train"/>
  <path d="M1415 272 C1415 380 960 350 880 406" class="infer"/>

  <rect x="40" y="475" width="1520" height="370" rx="22" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="68" y="507" class="lane" fill="#1d4ed8">训练与推理共享 · 主 Transformer 在训练时承担 CVAE decoder 的角色</text>

  <rect x="70" y="545" width="225" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="182" y="577" text-anchor="middle" class="heading">时刻 t 的相机画面</text>
  <text x="182" y="606" text-anchor="middle" class="body">world image · wrist image</text>
  <text x="182" y="630" text-anchor="middle" class="small">只使用当前 observation</text>

  <path d="M295 597 H345" class="flow"/>
  <rect x="345" y="545" width="245" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="467" y="577" text-anchor="middle" class="heading">共享视觉主干</text>
  <text x="467" y="606" text-anchor="middle" class="body">配置的 ResNet + projection</text>
  <text x="467" y="630" text-anchor="middle" class="small">每路相机的空间特征 token</text>

  <rect x="70" y="690" width="225" height="90" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="182" y="723" text-anchor="middle" class="heading">当前机器人状态</text>
  <text x="182" y="752" text-anchor="middle" class="code">q_t</text>
  <path d="M295 735 H345" class="flow"/>
  <rect x="345" y="690" width="245" height="90" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="467" y="723" text-anchor="middle" class="heading">State projection</text>
  <text x="467" y="752" text-anchor="middle" class="small">一个 state 条件 token</text>

  <rect x="680" y="530" width="285" height="250" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="822" y="565" text-anchor="middle" class="heading">Transformer encoder</text>
  <rect x="710" y="588" width="225" height="38" rx="11" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="822" y="613" text-anchor="middle" class="body">多相机视觉 token</text>
  <rect x="710" y="638" width="225" height="38" rx="11" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="822" y="663" text-anchor="middle" class="body">机器人 state token</text>
  <rect x="710" y="688" width="225" height="38" rx="11" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="822" y="713" text-anchor="middle" class="body">latent token z</text>
  <text x="822" y="752" text-anchor="middle" class="small">输出 context memory</text>
  <path d="M590 597 H680" class="flow"/>
  <path d="M590 735 H680" class="flow"/>
  <path d="M780 447 V462 H1000 V500 C1000 515 950 515 930 530" class="flow"/>

  <path d="M965 640 H1060" class="flow"/>
  <rect x="1060" y="545" width="255" height="190" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1187" y="581" text-anchor="middle" class="heading">Transformer decoder</text>
  <text x="1187" y="613" text-anchor="middle" class="body">对 encoder memory 做 cross-attention</text>
  <text x="1187" y="639" text-anchor="middle" class="body">每个 query 对应一个 decoder slot</text>
  <rect x="1092" y="670" width="191" height="38" rx="11" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="1187" y="695" text-anchor="middle" class="small">H 个动作块位置</text>

  <rect x="1035" y="775" width="305" height="58" rx="16" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="1187" y="799" text-anchor="middle" class="heading">Learned action queries</text>
  <text x="1187" y="820" text-anchor="middle" class="small">H 个时间位置各有一个 positional embedding</text>
  <path d="M1187 775 V735" class="flow"/>

  <path d="M1315 640 H1365" class="flow"/>
  <rect x="1365" y="545" width="165" height="190" rx="20" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/>
  <text x="1447" y="579" text-anchor="middle" class="heading">Action head</text>
  <text x="1447" y="608" text-anchor="middle" class="body">线性 projection</text>
  <text x="1447" y="650" text-anchor="middle" class="code">a_hat_t</text>
  <text x="1447" y="675" text-anchor="middle" class="code">...</text>
  <text x="1447" y="700" text-anchor="middle" class="code">a_hat_t+H-1</text>
  <text x="1447" y="723" text-anchor="middle" class="small">预测动作块</text>

  <rect x="40" y="875" width="750" height="70" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="1.7"/>
  <text x="415" y="903" text-anchor="middle" class="heading">训练目标</text>
  <text x="415" y="929" text-anchor="middle" class="code">masked L1(action chunk) + kl_weight * KL(qφ || N(0, I))</text>
  <rect x="810" y="875" width="750" height="70" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="1.7"/>
  <text x="1185" y="903" text-anchor="middle" class="heading">运行时 action queue</text>
  <text x="1185" y="929" text-anchor="middle" class="body">最多消费 n_action_steps 个预测，再读取新 observation 并请求下一个动作块</text>
  <text x="800" y="970" text-anchor="middle" class="small">课程原创示意图，架构依据 Zhao et al.（2023）及课程锁定的 LeRobot 0.6.0 ACT 实现。</text>
</svg>
