<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">The same robot task under four kinds of visual domain variation</title>
  <desc id="desc">A fixed banana-to-bowl manipulation task is held constant while visual domain parameters are sampled. Four stylized views show appearance changes such as color, texture, and material; camera changes such as pose and field of view; scene and lighting changes such as illumination, background, clutter, and distractors; and sensor or image-pipeline changes such as noise, blur, dropout, and exposure. Teal labels show that lesson 11 currently implements flat table and object color, field of view, and static world-camera pose. Texture, material, lighting, background, clutter, and sensor corruption are conceptual examples only. This is a course-created schematic based on parameter categories described by Tobin and colleagues in 2017, not a reproduction of a paper figure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="taskArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      .title { font: 700 30px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .section { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .heading { font: 700 16px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .tiny { font: 600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
      .code { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e293b; }
      .flow { stroke: #64748b; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .taskFlow { stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 4; fill: none; marker-end: url(#taskArrow); }
      .arm { stroke: #64748b; stroke-width: 11; stroke-linecap: round; fill: none; }
      .joint { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
      .table { stroke: #475569; stroke-width: 5; stroke-linecap: round; }
    </style>
  </defs>

